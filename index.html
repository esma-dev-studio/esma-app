function Onboarding({subjects,setSubjects,schedules,setSchedules,cfg,setCfg,onComplete}){
  const[step,setStep]=useState(1);
  const[local,setLocal]=useState({...cfg});
  const DAYS_JP=['日','月','火','水','木','金','土'];

  const saveAndNext=()=>{
    setCfg(p=>({...p,...local}));
    setStep(s=>s+1);
  };

  const overlayStyle={position:'fixed',inset:0,background:'rgba(15,23,42,0.65)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:9999,padding:16};
  const boxStyle={background:'#fff',borderRadius:20,padding:28,maxWidth:420,width:'100%',boxShadow:'0 20px 60px rgba(0,0,0,0.18)'};

  if(step===1) return (
    <div style={overlayStyle}>
      <div style={boxStyle}>
        <div style={{textAlign:'center',marginBottom:20}}>
          <div style={{fontSize:32,marginBottom:8}}>🎓</div>
          <div style={{fontSize:20,fontWeight:800,color:'#1e293b',marginBottom:6}}>院試サポートアプリへようこそ</div>
          <div style={{fontSize:13,color:'#64748b'}}>まず基本情報を設定しましょう。あとから変更できます。</div>
        </div>
        {[
          {label:'志望大学院',key:'targetGraduateSchool',type:'text',placeholder:'例: ○○大学大学院'},
          {label:'専攻・研究科',key:'department',type:'text',placeholder:'例: 情報工学専攻'},
          {label:'試験日',key:'examDate',type:'date'},
          {label:'学習開始日',key:'startDate',type:'date'},
        ].map(({label,key,type,placeholder})=>(
          <div key={key} style={{marginBottom:12}}>
            <label style={{fontSize:12,fontWeight:700,color:'#64748b',display:'block',marginBottom:4}}>{label}</label>
            <input type={type} placeholder={placeholder||''} value={local[key]||''} onChange={e=>setLocal(p=>({...p,[key]:e.target.value}))}
              style={{width:'100%',padding:'10px 12px',borderRadius:10,border:'1.5px solid #e2e8f0',fontSize:14,boxSizing:'border-box'}}/>
          </div>
        ))}
        <button onClick={saveAndNext} style={{width:'100%',padding:12,borderRadius:12,border:'none',background:BRAND,color:'#fff',fontWeight:800,fontSize:15,cursor:'pointer',marginTop:8}}>
          次へ →
        </button>
      </div>
    </div>
  );

  if(step===2) return (
    <div style={overlayStyle}>
      <div style={boxStyle}>
        <div style={{textAlign:'center',marginBottom:20}}>
          <div style={{fontSize:28,marginBottom:6}}>📚</div>
          <div style={{fontSize:18,fontWeight:800,color:'#1e293b',marginBottom:4}}>学習科目を確認</div>
          <div style={{fontSize:13,color:'#64748b'}}>サンプル科目が入っています。設定画面で追加・編集できます。</div>
        </div>
        <div style={{maxHeight:220,overflowY:'auto',marginBottom:16}}>
          {subjects.map(s=>(
            <div key={s.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 12px',background:'#f8fafc',borderRadius:10,marginBottom:8,border:'1px solid #e2e8f0'}}>
              <div>
                <div style={{fontSize:14,fontWeight:700,color:'#1e293b'}}>{s.name}</div>
                <div style={{fontSize:11,color:'#94a3b8'}}>重要度 {'★'.repeat(s.importance||1)} / 現Lv {s.currentLevel}→目標Lv {s.targetLevel}</div>
              </div>
            </div>
          ))}
        </div>
        <div style={{display:'flex',gap:10}}>
          <button onClick={()=>setStep(1)} style={{flex:1,padding:11,borderRadius:11,border:'1.5px solid #e2e8f0',background:'#fff',color:'#64748b',fontWeight:700,fontSize:14,cursor:'pointer'}}>← 戻る</button>
          <button onClick={()=>setStep(3)} style={{flex:2,padding:11,borderRadius:11,border:'none',background:BRAND,color:'#fff',fontWeight:800,fontSize:14,cursor:'pointer'}}>次へ →</button>
        </div>
      </div>
    </div>
  );

  if(step===3) return (
    <div style={overlayStyle}>
      <div style={boxStyle}>
        <div style={{textAlign:'center',marginBottom:20}}>
          <div style={{fontSize:28,marginBottom:6}}>📅</div>
          <div style={{fontSize:18,fontWeight:800,color:'#1e293b',marginBottom:4}}>週間スケジュールを確認</div>
          <div style={{fontSize:13,color:'#64748b'}}>各曜日の学習時間目標です。設定画面で変更できます。</div>
        </div>
        <div style={{marginBottom:16}}>
          {[0,1,2,3,4,5,6].map(dow=>{
            const dayScheds=schedules.filter(sc=>sc.dayOfWeek===dow&&sc.enabled);
            const total=dayScheds.reduce((s,sc)=>s+(sc.targetHours||0),0);
            return(
              <div key={dow} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',background:dow===0||dow===6?'#fef9f0':'#f8fafc',borderRadius:9,marginBottom:6,border:'1px solid #e2e8f0'}}>
                <div style={{fontWeight:700,color:dow===0||dow===6?'#d97706':'#1e293b'}}>{DAYS_JP[dow]}曜日</div>
                <div style={{fontSize:13,color:'#64748b'}}>{total>0?`${total}h`:'休み'}</div>
              </div>
            );
          })}
        </div>
        <div style={{display:'flex',gap:10}}>
          <button onClick={()=>setStep(2)} style={{flex:1,padding:11,borderRadius:11,border:'1.5px solid #e2e8f0',background:'#fff',color:'#64748b',fontWeight:700,fontSize:14,cursor:'pointer'}}>← 戻る</button>
          <button onClick={()=>setStep(4)} style={{flex:2,padding:11,borderRadius:11,border:'none',background:BRAND,color:'#fff',fontWeight:800,fontSize:14,cursor:'pointer'}}>次へ →</button>
        </div>
      </div>
    </div>
  );

  if(step===4) return (
    <div style={overlayStyle}>
      <div style={boxStyle}>
        <div style={{textAlign:'center',padding:'12px 0 24px'}}>
          <div style={{fontSize:48,marginBottom:12}}>🚀</div>
          <div style={{fontSize:20,fontWeight:800,color:'#1e293b',marginBottom:8}}>準備完了！</div>
          <div style={{fontSize:14,color:'#64748b',lineHeight:1.7,marginBottom:24}}>
            毎日の学習記録をつけることで、<br/>ペースを可視化して合格に近づけましょう！
          </div>
          <button onClick={onComplete} style={{width:'100%',padding:14,borderRadius:13,border:'none',background:BRAND,color:'#fff',fontWeight:800,fontSize:16,cursor:'pointer',letterSpacing:0.5}}>
            学習を始める 🎯
          </button>
        </div>
      </div>
    </div>
  );

  return null;
}

/* ─── 講師：メトリクス計算（studentId分離版） ───── */
function calcStudentMetrics(profile,subjects,schedules,dailyRecs){
  const ws=weekStart(),td=todayStr(),wsDt=new Date(ws+'T00:00:00');
  let weekPlanned=0;
  for(let i=0;i<7;i++){
    const d=fmt(addDays(wsDt,i)); if(d>td)break;
    const dow=new Date(d+'T00:00:00').getDay();
    schedules.filter(sc=>sc.enabled&&sc.dayOfWeek===dow).forEach(sc=>weekPlanned+=sc.targetHours||0);
  }
  const weekRecs=dailyRecs.filter(r=>r.date>=ws&&r.date<=td);
  const weekActual=r2(weekRecs.reduce((s,r)=>s+(r.actualHours||0),0));
  const weekAchievementRate=weekPlanned>0?Math.round(weekActual/weekPlanned*100):0;
  const todayRecs=dailyRecs.filter(r=>r.date===td);
  const todayActual=r2(todayRecs.reduce((s,r)=>s+(r.actualHours||0),0));
  const todayRecorded=todayRecs.some(r=>r.actualHours>0);
  const recent3=[];
  for(let i=1;i<=3;i++){
    const d=fmt(addDays(getToday(),-i)),dow=new Date(d+'T00:00:00').getDay();
    if(schedules.some(sc=>sc.enabled&&sc.dayOfWeek===dow&&(sc.targetHours||0)>0))
      recent3.push(dailyRecs.some(r=>r.date===d&&r.actualHours>0));
  }
  const recentMissing=recent3.length>=2&&recent3.every(v=>!v);
  const subjectWeekMetrics=subjects.map(s=>{
    const sch=schedules.filter(sc=>sc.subjectId===s.id&&sc.enabled);
    let planned=0;
    for(let i=0;i<7;i++){
      const d=fmt(addDays(wsDt,i)); if(d>td)break;
      const dow=new Date(d+'T00:00:00').getDay();
      sch.filter(sc=>sc.dayOfWeek===dow).forEach(sc=>planned+=sc.targetHours||0);
    }
    const actual=r2(weekRecs.filter(r=>r.subjectId===s.id).reduce((sum,r)=>sum+(r.actualHours||0),0));
    return{...s,planned:r2(planned),actual,pct:planned>0?Math.round(actual/planned*100):null};
  });
  let simpleStatus='順調';
  if(weekAchievementRate<50||recentMissing)simpleStatus='要確認';
  else if(weekAchievementRate<80)simpleStatus='やや遅れ';
  return{daysLeft:daysUntil(profile.examDate),weekPlanned:r2(weekPlanned),weekActual,weekAchievementRate,todayActual,todayRecorded,subjectWeekMetrics,simpleStatus};
}

  const[form,setForm]=useState({privateMemo:'',studentVisibleAction:'',nextMeetingDate:''});
  const[detailTab,setDetailTab]=useState('overview');

  const last7=useMemo(()=>{
    const days=[];
    for(let i=6;i>=0;i--){
      const d=fmt(addDays(getToday(),-i)),dt=new Date(d+'T00:00:00');
      const recs=dailyRecs.filter(r=>r.date===d);
      const actual=r2(recs.reduce((s,r)=>s+(r.actualHours||0),0));
      days.push({date:d,label:`${dt.getMonth()+1}/${dt.getDate()}`,dow:DOW_LABELS[dt.getDay()],actual,recorded:recs.some(r=>r.actualHours>0)});

  // per-student setter（講師・管理者が生徒データを代理編集するため）

    setAll(prev=>{
      const others=(prev||[]).filter(x=>x.studentId!==sid);
      const mine=(prev||[]).filter(x=>x.studentId===sid);
      const next=typeof updater==='function'?updater(mine):updater;
      return[...others,...next.map(x=>({...x,studentId:sid}))];
    });
  }:null;
  const setSubjectsF=useMemo(()=>mss(setAllSubjects,profile.id),[setAllSubjects,profile?.id]);
  const setSchedulesF=useMemo(()=>mss(setAllSchedules,profile.id),[setAllSchedules,profile?.id]);
  const tasksF=useMemo(()=>(allTasks||[]).filter(t=>t.studentId===profile.id),[allTasks,profile?.id]);
  const setTasksF=useMemo(()=>mss(setAllTasks,profile.id),[setAllTasks,profile?.id]);
  const cfg=useMemo(()=>({...INIT_CFG,...profile}),[profile]);
  const setCfg=useCallback((updater)=>{
    if(!setStudentProfiles)return;
    setStudentProfiles(prev=>(prev||[]).map(p=>p.id===profile.id?{...p,...(typeof updater==='function'?updater(p):updater)}:p));

/* ─── DB同期セッター（楽観的更新 + Supabaseへ書き込み） ── */
function makeDbSetter(localSetter, tableName) {
  return (updater) => {
    localSetter(prev => {
      const next = typeof updater === 'function' ? updater(Array.isArray(prev)?prev:[]) : updater;
      if (!sb || !Array.isArray(next)) return next;
      const prevMap = new Map((prev||[]).map(x=>[x.id, JSON.stringify(x)]));
      const nextMap = new Map(next.map(x=>[x.id, JSON.stringify(x)]));
      const toDelete = (prev||[]).filter(x=>!nextMap.has(x.id)).map(x=>x.id);
      const toUpsert = next.filter(x=>!prevMap.has(x.id)||prevMap.get(x.id)!==nextMap.get(x.id));
      if(toDelete.length) sb.from(tableName).delete().in('id',toDelete).then(r=>r.error&&console.error('[DB delete]',r.error));
      if(toUpsert.length) sb.from(tableName).upsert(toUpsert).then(r=>r.error&&console.error('[DB upsert]',r.error));
      return next;
    });
  };
}

                style={{width:'100%',padding:'11px 13px',borderRadius:10,border:'1.5px solid #e2e8f0',fontSize:14}}/>
            </div>
            {err&&<div style={{background:'#fff1f2',border:'1px solid #fecaca',borderRadius:8,padding:'8px 12px',color:'#dc2626',fontSize:12,marginBottom:12}}>{err}</div>}
            <button onClick={go} disabled={loading}
              style={{width:'100%',padding:'13px',borderRadius:12,border:'none',background:loading?'#a5b4fc':BRAND,color:'#fff',fontWeight:800,fontSize:15,cursor:loading?'not-allowed':'pointer',marginBottom:12}}>
              {loading?'処理中...':(mode==='login'?'ログイン':'アカウント作成')}
            </button>
            <button onClick={()=>{setMode(m=>m==='login'?'signup':'login');setErr('');}}
              style={{width:'100%',padding:'10px',borderRadius:12,border:'1.5px solid #e2e8f0',background:'#fff',color:'#64748b',fontWeight:600,fontSize:13,cursor:'pointer'}}>
              {mode==='login'?'初めての方はこちら（アカウント作成）':'ログイン画面に戻る'}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

/* ─── 未アクティベート画面 ─────────────────────────────── */
function WaitingScreen({email,onLogout}){
  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f8fafc',padding:20}}>
      <div style={{background:'#fff',borderRadius:20,padding:32,maxWidth:360,width:'100%',textAlign:'center',boxShadow:'0 4px 20px rgba(0,0,0,.08)'}}>
        <div style={{fontSize:40,marginBottom:12}}>⏳</div>
        <div style={{fontSize:18,fontWeight:800,color:'#1e293b',marginBottom:8}}>アカウントを確認中</div>
        <div style={{fontSize:13,color:'#64748b',lineHeight:1.7,marginBottom:20}}>
          <strong>{email}</strong> のアカウントはまだ講師によって有効化されていません。<br/>
          講師に連絡してアカウントを有効化してもらってください。

/* ─── Supabase版メインアプリ ───────────────────────────── */
function SupabaseApp(){
  const[authUser,setAuthUser]=useState(null);
  const[authLoading,setAuthLoading]=useState(true);
  const[dataLoading,setDataLoading]=useState(false);
  const[dataErr,setDataErr]=useState(null);
  const[currentRole,setCurrentRole]=useState(null);
  const[currentUserId,setCurrentUserId]=useState(null);
  const[currentStudentId,setCurrentStudentId]=useState(null);
  const[tab,setTab]=useState('dashboard');

  // 生徒用
  const[currentProfile,setCurrentProfile]=useState(null);
  const[subjects,setSubjectsRaw]=useState([]);
  const[schedules,setSchedulesRaw]=useState([]);
  const[dailyRecs,setDailyRecsRaw]=useState([]);
  const[tasks,setTasksRaw]=useState([]);
  const[myNotes,setMyNotes]=useState([]);

  // 講師用
  const[studentProfiles,setStudentProfilesRaw]=useState([]);
  const[instructorAllProfiles,setInstructorAllProfilesRaw]=useState([]);
  const[allSubjects,setAllSubjectsRaw]=useState([]);
  const[allSchedules,setAllSchedulesRaw]=useState([]);
  const[allDailyRecs,setAllDailyRecsRaw]=useState([]);
  const[instructorStudents,setInstructorStudentsRaw]=useState([]);
  const[instructorNotes,setInstructorNotesRaw]=useState([]);
  const[allTasksInst,setAllTasksInstRaw]=useState([]);

  // 管理者用
  const[adminUsers,setAdminUsersRaw]=useState([]);
  const[adminProfiles,setAdminProfilesRaw]=useState([]);
  const[adminIS,setAdminISRaw]=useState([]);
  const[adminAllSubjects,setAdminAllSubjectsRaw]=useState([]);
  const[adminAllSchedules,setAdminAllSchedulesRaw]=useState([]);
  const[adminAllDailyRecs,setAdminAllDailyRecsRaw]=useState([]);
  const[adminInstructorNotes,setAdminInstructorNotesRaw]=useState([]);
  const[adminAllTasks,setAdminAllTasksRaw]=useState([]);

  // DB同期セッター
  const setSubjects      =useMemo(()=>makeDbSetter(setSubjectsRaw,     'subjects'),     []);
  const setSchedules     =useMemo(()=>makeDbSetter(setSchedulesRaw,    'schedules'),    []);
  const setDailyRecs     =useMemo(()=>makeDbSetter(setDailyRecsRaw,    'daily_records'),[]);
  const setTasks         =useMemo(()=>makeDbSetter(setTasksRaw,        'tasks'),        []);
  const setInstructorNotes=useMemo(()=>makeDbSetter(setInstructorNotesRaw,'instructor_notes'),[]);
  const setAdminUsers    =useMemo(()=>makeDbSetter(setAdminUsersRaw,   'users'),        []);
  const setAdminProfiles =useMemo(()=>makeDbSetter(setAdminProfilesRaw,'student_profiles'),[]);
  const setAdminIS       =useMemo(()=>makeDbSetter(setAdminISRaw,      'instructor_students'),[]);
  const setAdminAllSubjects=useMemo(()=>makeDbSetter(setAdminAllSubjectsRaw,'subjects'),[]);
  const setAdminAllSchedules=useMemo(()=>makeDbSetter(setAdminAllSchedulesRaw,'schedules'),[]);
  const setAdminAllDailyRecs=useMemo(()=>makeDbSetter(setAdminAllDailyRecsRaw,'daily_records'),[]);
  const setAdminInstructorNotes=useMemo(()=>makeDbSetter(setAdminInstructorNotesRaw,'instructor_notes'),[]);
  const setStudentProfilesDb=useMemo(()=>makeDbSetter(setStudentProfilesRaw,'student_profiles'),[]);
  const setInstructorStudentsDb=useMemo(()=>makeDbSetter(setInstructorStudentsRaw,'instructor_students'),[]);
  const setAllSubjectsInstDb=useMemo(()=>makeDbSetter(setAllSubjectsRaw,'subjects'),[]);
  const setAllSchedulesInstDb=useMemo(()=>makeDbSetter(setAllSchedulesRaw,'schedules'),[]);
  const setAllTasksInstDb=useMemo(()=>makeDbSetter(setAllTasksInstRaw,'tasks'),[]);
  const setAdminAllTasksDb=useMemo(()=>makeDbSetter(setAdminAllTasksRaw,'tasks'),[]);

  // cfg互換
  const cfg=useMemo(()=>({...INIT_CFG,...currentProfile}),[currentProfile]);
  const setCfg=useCallback((upd)=>{
    setCurrentProfile(prev=>{
      const next={...prev,...(typeof upd==='function'?upd(prev):upd)};
      if(next?.id)sb.from('student_profiles').update(next).eq('id',next.id).then(r=>r.error&&console.error(r.error));
      return next;
    });
  },[]);
  const[onboarded,setOnboardedState]=useState(false);
  const setOnboarded=(v)=>{
    setOnboardedState(v);
    if(currentProfile?.id)sb.from('student_profiles').update({onboarded:v}).eq('id',currentProfile.id).then(r=>r.error&&console.error(r.error));
  };

  // Auth
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{setAuthUser(session?.user||null);setAuthLoading(false);});
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>setAuthUser(session?.user||null));
    return()=>subscription.unsubscribe();
  },[]);

  useEffect(()=>{if(authUser?.id)loadData(authUser.id);},[authUser?.id]);

  const loadData=async(uid)=>{
    setDataLoading(true);setDataErr(null);
    try{
      const{data:u,error:ue}=await sb.from('users').select('*').eq('id',uid).single();
      if(ue||!u)throw new Error('ユーザー情報が見つかりません。管理者に連絡してください。');
      setCurrentRole(u.role);setCurrentUserId(uid);
      if(u.role==='student'){
        const sid=u.studentId;setCurrentStudentId(sid);
        const[pr,su,sc,dr,ta,no]=await Promise.all([
          sb.from('student_profiles').select('*').eq('id',sid).single(),
          sb.from('subjects').select('*').eq('studentId',sid),
          sb.from('schedules').select('*').eq('studentId',sid),
          sb.from('daily_records').select('*').eq('studentId',sid),
          sb.from('tasks').select('*').eq('studentId',sid),
          sb.from('instructor_notes').select('*').eq('studentId',sid),
        ]);
        setCurrentProfile(pr.data);setOnboardedState(pr.data?.onboarded||false);
        setSubjectsRaw(su.data||[]);setSchedulesRaw(sc.data||[]);
        setDailyRecsRaw(dr.data||[]);setTasksRaw(ta.data||[]);setMyNotes(no.data||[]);
      }else if(u.role==='instructor'){
        const[pr,su,sc,dr,ta,no]=await Promise.all([
          sb.from('student_profiles').select('*'),
          sb.from('subjects').select('*'),
          sb.from('schedules').select('*'),
          sb.from('daily_records').select('*'),
          sb.from('tasks').select('*'),
          sb.from('instructor_notes').select('*').eq('instructorUserId',uid),
        ]);
        setStudentProfilesRaw(pr.data||[]);setAllSubjectsRaw(su.data||[]);
        setAllSchedulesRaw(sc.data||[]);setAllDailyRecsRaw(dr.data||[]);
        setAllTasksInstRaw(ta.data||[]);setInstructorNotesRaw(no.data||[]);
      }else{
        const[us,pr,is,su,sc,dr,no,ta]=await Promise.all([
          sb.from('users').select('*'),
          sb.from('student_profiles').select('*'),
          sb.from('instructor_students').select('*'),
          sb.from('subjects').select('*'),
          sb.from('schedules').select('*'),
          sb.from('daily_records').select('*'),
          sb.from('instructor_notes').select('*'),
          sb.from('tasks').select('*'),
        ]);
        setAdminUsersRaw(us.data||[]);setAdminProfilesRaw(pr.data||[]);setAdminISRaw(is.data||[]);
        setAdminAllSubjectsRaw(su.data||[]);setAdminAllSchedulesRaw(sc.data||[]);
        setAdminAllDailyRecsRaw(dr.data||[]);setAdminInstructorNotesRaw(no.data||[]);
        setAdminAllTasksRaw(ta.data||[]);
      }
    }catch(e){setDataErr(e.message);}
    finally{setDataLoading(false);}
  };

  const logout=()=>sb.auth.signOut();
  const handleOnboardingComplete=()=>{setOnboarded(true);setTab('today');};

  if(authLoading)return<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'#64748b',fontSize:13}}>読み込み中...</div>;
  if(!authUser)return<LoginScreen/>;
  if(dataLoading)return<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'#64748b',fontSize:13}}>データ取得中...</div>;
  if(dataErr)return(
    <div style={{padding:24,maxWidth:400,margin:'60px auto'}}>
      <div style={{background:'#fff1f2',border:'1px solid #fecaca',borderRadius:12,padding:16,color:'#dc2626',marginBottom:16,fontSize:13}}>{dataErr}</div>
      <button onClick={()=>loadData(authUser.id)} style={{padding:'10px 20px',borderRadius:9,border:'none',background:BRAND,color:'#fff',fontWeight:700,cursor:'pointer',marginRight:8}}>再試行</button>
      <button onClick={logout} style={{padding:'10px 20px',borderRadius:9,border:'1px solid #e2e8f0',background:'#fff',color:'#64748b',fontWeight:600,cursor:'pointer'}}>ログアウト</button>
    </div>
  );
  if(!currentRole)return<WaitingScreen email={authUser.email} onLogout={logout}/>;

  const hdr=(
    <div style={{background:'#fff',borderBottom:'1px solid #e8ecf0',padding:'8px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,zIndex:150}}>
      <span style={{fontSize:13,fontWeight:800,color:BRAND}}>ESMA</span>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <span style={{fontSize:10,color:'#94a3b8',maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{authUser.email}</span>
        <button onClick={logout} style={{padding:'4px 10px',borderRadius:7,border:'1px solid #e2e8f0',background:'#fff',color:'#64748b',fontSize:10,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>ログアウト</button>
      </div>
    </div>
  );
  const navSt={position:'fixed',bottom:0,left:0,right:0,background:'rgba(255,255,255,.97)',borderTop:'1px solid #e2e8f0',display:'flex',backdropFilter:'blur(10px)',zIndex:100,paddingBottom:'env(safe-area-inset-bottom,0px)'};
  const nb=(a)=>({flex:1,padding:'8px 2px 6px',border:'none',background:'transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:1,color:a?BRAND:'#94a3b8'});

  if(currentRole==='student'){
    const latestAction=myNotes.filter(n=>!n.checked&&n.studentVisibleAction).sort((a,b)=>b.date.localeCompare(a.date))[0];
    return(
      <div style={{maxWidth:430,margin:'0 auto',minHeight:'100vh',background:'#f8fafc',paddingBottom:68}}>
        {hdr}
        {!onboarded&&currentProfile&&<Onboarding subjects={subjects} setSubjects={setSubjects} schedules={schedules} setSchedules={setSchedules} cfg={cfg} setCfg={setCfg} onComplete={handleOnboardingComplete}/>}
        {latestAction&&(
          <div style={{margin:'10px 14px 0',padding:'11px 14px',background:'#eef2ff',borderRadius:11,border:'1px solid #c7d2fe',display:'flex',gap:8,alignItems:'flex-start'}}>
            <span style={{fontSize:16,flexShrink:0}}>📌</span>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:'#4f46e5',marginBottom:2}}>講師からのアクション</div>
              <div style={{fontSize:13,color:'#1e293b',lineHeight:1.5}}>{latestAction.studentVisibleAction}</div>
              {latestAction.nextMeetingDate&&<div style={{fontSize:11,color:'#6366f1',marginTop:3}}>次回面談：{latestAction.nextMeetingDate}</div>}
            </div>
          </div>
        )}
        {tab==='dashboard'&&<Dashboard cfg={cfg} subjects={subjects} schedules={schedules} tasks={tasks} dailyRecs={dailyRecs}/>}
        {tab==='today'&&<TodayView cfg={cfg} subjects={subjects} schedules={schedules} dailyRecs={dailyRecs} setDailyRecs={setDailyRecs}/>}
        {tab==='plan'&&<PlanView cfg={cfg} subjects={subjects} schedules={schedules} tasks={tasks} setTasks={setTasks}/>}
        {tab==='settings'&&<SettingsView cfg={cfg} setCfg={setCfg} subjects={subjects} setSubjects={setSubjects} schedules={schedules} setSchedules={setSchedules} dailyRecs={dailyRecs} setDailyRecs={setDailyRecs} tasks={tasks} setTasks={setTasks}/>}
        <nav style={navSt}>{STUDENT_TABS.map(t=><button key={t.id} style={nb(tab===t.id)} onClick={()=>setTab(t.id)}><span style={{fontSize:18}}>{t.icon}</span><span style={{fontSize:9,fontWeight:tab===t.id?800:500}}>{t.label}</span></button>)}</nav>
      </div>
    );
  }
  if(currentRole==='instructor')return(
    <div style={{maxWidth:430,margin:'0 auto',minHeight:'100vh',background:'#f8fafc'}}>
      {hdr}
      <InstructorView instructorUserId={currentUserId} studentProfiles={studentProfiles} allSubjects={allSubjects} allSchedules={allSchedules} allDailyRecs={allDailyRecs} instructorNotes={instructorNotes} setInstructorNotes={setInstructorNotes} setStudentProfiles={setStudentProfilesDb} setAllSubjects={setAllSubjectsInstDb} setAllSchedules={setAllSchedulesInstDb} allTasks={allTasksInst} setAllTasks={setAllTasksInstDb}/>
    </div>
  );
  return(
    <div style={{maxWidth:430,margin:'0 auto',minHeight:'100vh',background:'#f8fafc'}}>
      {hdr}
      <AdminView users={adminUsers} setUsers={setAdminUsers} studentProfiles={adminProfiles} setStudentProfiles={setAdminProfiles} instructorStudents={adminIS} setInstructorStudents={setAdminIS} allSubjects={adminAllSubjects} allSchedules={adminAllSchedules} allDailyRecs={adminAllDailyRecs} instructorNotes={adminInstructorNotes} setInstructorNotes={setAdminInstructorNotes} currentUserId={currentUserId} allTasks={adminAllTasks} setAllTasks={setAdminAllTasksDb}/>
    </div>
  );
}

const STUDENT_TABS=[
  {id:'dashboard',label:'ダッシュ',icon:'📊'},
  {id:'today',    label:'今日の記録',icon:'✍️'},
  {id:'plan',     label:'学習計画',icon:'📋'},
  {id:'settings', label:'設定',icon:'⚙️'},
];

/* ─── メインアプリ（複数ユーザー対応） ──────────── */
function App(){
  // セッション（ロール切替）
  const[session,setSession]=useStorage('esma_v2_session',DEFAULT_SESSION);
  // 全データ（studentId付き）
  const[users,setUsers]=useStorage('esma_v2_users',INIT_USERS);
  const[studentProfiles,setStudentProfiles]=useStorage('esma_v2_students',INIT_STUDENT_PROFILES);
  const[allSubjects,setAllSubjects]=useStorage('esma_v2_subjects',INIT_SUBJECTS_V2);
  const[allSchedules,setAllSchedules]=useStorage('esma_v2_schedules',INIT_SCHEDULES_V2);
  const[allDailyRecs,setAllDailyRecs]=useStorage('esma_v2_daily',INIT_DAILY_V2);
  const[allTasks,setAllTasks]=useStorage('esma_v2_tasks',INIT_TASKS_V2);
  const[instructorNotes,setInstructorNotes]=useStorage('esma_v2_inotes',INIT_INSTRUCTOR_NOTES);
  const[instructorStudents,setInstructorStudents]=useStorage('esma_v2_instructor_students',INIT_INSTRUCTOR_STUDENTS);
  const[tab,setTab]=useState('dashboard');

  // 現在のユーザー・ロール解決
  const currentUser=useMemo(()=>users.find(u=>u.id===session.userId)||users[0],[users,session.userId]);
  const currentRole=currentUser?.role||'student';
  const currentStudentId=currentUser?.studentId||null;
  const currentProfile=useMemo(()=>studentProfiles.find(p=>p.id===currentStudentId),[studentProfiles,currentStudentId]);
  const onboarded=currentProfile?.onboarded||false;

  // 現在の生徒に絞り込んだデータ（生徒ロール用）
  const subjects=useMemo(()=>allSubjects.filter(s=>s.studentId===currentStudentId),[allSubjects,currentStudentId]);
  const schedules=useMemo(()=>allSchedules.filter(s=>s.studentId===currentStudentId),[allSchedules,currentStudentId]);
  const dailyRecs=useMemo(()=>allDailyRecs.filter(r=>r.studentId===currentStudentId),[allDailyRecs,currentStudentId]);
  const tasks=useMemo(()=>allTasks.filter(t=>t.studentId===currentStudentId),[allTasks,currentStudentId]);

  // studentIdを自動付与するラッパーセッター（既存コンポーネントをそのまま使うため）
  const makeSetterFor=(setAll,sid)=>(updater)=>{
    setAll(prev=>{
      const others=prev.filter(x=>x.studentId!==sid);
      const mine=prev.filter(x=>x.studentId===sid);
      const next=typeof updater==='function'?updater(mine):updater;
      return[...others,...next.map(x=>({...x,studentId:sid}))];
    });
  };
  const setSubjects  =useMemo(()=>makeSetterFor(setAllSubjects,  currentStudentId),[currentStudentId]);
  const setSchedules =useMemo(()=>makeSetterFor(setAllSchedules, currentStudentId),[currentStudentId]);
  const setDailyRecs =useMemo(()=>makeSetterFor(setAllDailyRecs, currentStudentId),[currentStudentId]);
  const setTasks     =useMemo(()=>makeSetterFor(setAllTasks,     currentStudentId),[currentStudentId]);

  // cfg（プロファイルを既存コンポーネント互換の形で提供）
  const cfg=useMemo(()=>({...INIT_CFG,...currentProfile}),[currentProfile]);
  const setCfg=useCallback((updater)=>{
    setStudentProfiles(prev=>prev.map(p=>p.id===currentStudentId
      ?{...p,...(typeof updater==='function'?updater(p):updater)}:p));
  },[currentStudentId]);

  const setOnboarded=(v)=>setStudentProfiles(prev=>prev.map(p=>p.id===currentStudentId?{...p,onboarded:v}:p));
  const handleOnboardingComplete=()=>{setOnboarded(true);setTab('today');};

  // ロール切替時にタブをリセット
  useEffect(()=>{setTab('dashboard');},[session.userId]);

  const navStyle={position:'fixed',bottom:0,left:0,right:0,background:'rgba(255,255,255,.97)',borderTop:'1px solid #e2e8f0',display:'flex',backdropFilter:'blur(10px)',zIndex:100,paddingBottom:'env(safe-area-inset-bottom,0px)'};
  const navBtn=(active)=>({flex:1,padding:'8px 2px 6px',border:'none',background:'transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:1,color:active?BRAND:'#94a3b8',transition:'color .15s'});

  // ─ 生徒ロール ─
  if(currentRole==='student'){
    return(
      <div style={{maxWidth:430,margin:'0 auto',minHeight:'100vh',background:'#f8fafc',paddingBottom:68}}>
        {/* ロール切替バー */}
        <div style={{background:'#fff',borderBottom:'1px solid #e8ecf0',padding:'8px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,zIndex:150}}>
          <span style={{fontSize:13,fontWeight:800,color:BRAND,letterSpacing:.3}}>ESMA</span>
          <RoleSwitcher session={session} setSession={setSession} users={users}/>
        </div>
        {!onboarded&&currentProfile&&(
          <Onboarding subjects={subjects} setSubjects={setSubjects} schedules={schedules} setSchedules={setSchedules} cfg={cfg} setCfg={setCfg} onComplete={handleOnboardingComplete}/>
        )}
        {/* 講師からの次回アクション（未確認の最新1件を表示） */}
        {(()=>{
          const note=instructorNotes
            .filter(n=>n.studentId===currentStudentId&&!n.checked&&n.studentVisibleAction)
            .sort((a,b)=>b.date.localeCompare(a.date))[0];
          if(!note)return null;
          return(
            <div style={{margin:'10px 14px 0',padding:'11px 14px',background:'#eef2ff',borderRadius:11,border:'1px solid #c7d2fe',display:'flex',gap:8,alignItems:'flex-start'}}>
              <span style={{fontSize:16,flexShrink:0}}>📌</span>
              <div>
                <div style={{fontSize:11,fontWeight:700,color:'#4f46e5',marginBottom:2}}>講師からのアクション</div>
                <div style={{fontSize:13,color:'#1e293b',lineHeight:1.5}}>{note.studentVisibleAction}</div>
                {note.nextMeetingDate&&<div style={{fontSize:11,color:'#6366f1',marginTop:3}}>次回面談：{note.nextMeetingDate}</div>}
              </div>
            </div>
          );
        })()}
        {tab==='dashboard'&&<Dashboard cfg={cfg} subjects={subjects} schedules={schedules} tasks={tasks} dailyRecs={dailyRecs}/>}
        {tab==='today'&&<TodayView cfg={cfg} subjects={subjects} schedules={schedules} dailyRecs={dailyRecs} setDailyRecs={setDailyRecs}/>}
        {tab==='plan'&&<PlanView cfg={cfg} subjects={subjects} schedules={schedules} tasks={tasks} setTasks={setTasks}/>}
        {tab==='settings'&&<SettingsView cfg={cfg} setCfg={setCfg} subjects={subjects} setSubjects={setSubjects} schedules={schedules} setSchedules={setSchedules} dailyRecs={dailyRecs} setDailyRecs={setDailyRecs} tasks={tasks} setTasks={setTasks}/>}
        <nav style={navStyle}>
          {STUDENT_TABS.map(t=>(
            <button key={t.id} style={navBtn(tab===t.id)} onClick={()=>setTab(t.id)}>
              <span style={{fontSize:18}}>{t.icon}</span>
              <span style={{fontSize:9,fontWeight:tab===t.id?800:500}}>{t.label}</span>
            </button>
          ))}
        </nav>
      </div>
    );
  }

  // ─ 講師ロール ─
  if(currentRole==='instructor'){
    return(
      <div style={{maxWidth:430,margin:'0 auto',minHeight:'100vh',background:'#f8fafc'}}>
        <div style={{background:'#fff',borderBottom:'1px solid #e8ecf0',padding:'8px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,zIndex:150}}>
          <span style={{fontSize:13,fontWeight:800,color:BRAND,letterSpacing:.3}}>ESMA</span>
          <RoleSwitcher session={session} setSession={setSession} users={users}/>
        </div>
        <InstructorView
          instructorUserId={currentUser.id}
          studentProfiles={studentProfiles}
          allSubjects={allSubjects}
          allSchedules={allSchedules}
          allDailyRecs={allDailyRecs}
          instructorNotes={instructorNotes}
          setInstructorNotes={setInstructorNotes}
          setStudentProfiles={setStudentProfiles}
          setAllSubjects={setAllSubjects}
          setAllSchedules={setAllSchedules}
          allTasks={allTasks}
          setAllTasks={setAllTasks}
        />
      </div>
    );
  }

  // ─ 管理者ロール ─
  return(
    <div style={{maxWidth:430,margin:'0 auto',minHeight:'100vh',background:'#f8fafc'}}>
      <div style={{background:'#fff',borderBottom:'1px solid #e8ecf0',padding:'8px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,zIndex:150}}>
        <span style={{fontSize:13,fontWeight:800,color:BRAND,letterSpacing:.3}}>ESMA</span>
        <RoleSwitcher session={session} setSession={setSession} users={users}/>
      </div>
      <AdminView
        users={users} setUsers={setUsers}
        studentProfiles={studentProfiles} setStudentProfiles={setStudentProfiles}
        instructorStudents={instructorStudents} setInstructorStudents={setInstructorStudents}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(IS_LIVE?<SupabaseApp/>:<App/>);
</script>
